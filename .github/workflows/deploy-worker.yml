# Deploys the lookup service (worker/) to Cloudflare Workers.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers")
# and ANTHROPIC_API_KEY (passed to the worker as a secret). The account ID is in worker/wrangler.toml.
name: Deploy lookup service

on:
  push:
    branches: ["main"]
    paths: ["worker/**", "lib/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Cloudflare secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN isn't set, so the lookup service wasn't deployed. See README."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: npm ci && npm ci --prefix worker
      - name: Check the Cloudflare token
        if: steps.check.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          account=$(grep -oP '^account_id = "\K[^"]+' worker/wrangler.toml)
          echo "Token length: ${#token} characters (Cloudflare tokens are usually 40)"
          user=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $token" | jq -r '.result.status // .errors[0].message // "invalid"')
          acct=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$account/tokens/verify" -H "Authorization: Bearer $token" | jq -r '.result.status // .errors[0].message // "invalid"')
          echo "As a personal (user) token: $user"
          echo "As an account token: $acct"
          if [ "$user" != "active" ] && [ "$acct" != "active" ]; then
            echo "::error::Cloudflare doesn't accept CLOUDFLARE_API_TOKEN. Copy the token value again (not the token ID) and update the secret."
            exit 1
          fi
      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Upload the Anthropic API key to the worker
        if: steps.check.outputs.skip != 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY isn't set; lookups won't work until it is."; exit 0; fi
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
