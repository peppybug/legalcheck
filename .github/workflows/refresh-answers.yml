# Builds the Legalcheck database: researches country law sources and legality answers with Claude,
# rebuilds the law index, and commits everything in public/data/.
# Needs the repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
name: Refresh answers

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday at 03:17 UTC
  workflow_dispatch:
    inputs:
      max:
        description: "How many answers to research in this run"
        default: "40"
      max_countries:
        description: "How many countries' law sources to research in this run"
        default: "20"
      refresh_days:
        description: "Re-research answers older than this many days"
        default: "180"

permissions:
  contents: write

concurrency:
  group: refresh-answers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Research answers
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX: ${{ inputs.max || '40' }}
          MAX_COUNTRIES: ${{ inputs.max_countries || '20' }}
          REFRESH_DAYS: ${{ inputs.refresh_days || '180' }}
      - name: Commit updated answers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Refresh database"
          git push
