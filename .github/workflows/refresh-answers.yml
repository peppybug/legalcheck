# Researches country law sources and legality answers with Claude, then opens a pull request for review.
# Nothing is published until a person reviews and merges the pull request (merging triggers the deploy).
#
# Needs:
#   - repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions)
#   - Settings → Actions → General → Workflow permissions:
#     "Allow GitHub Actions to create and approve pull requests" switched on
name: Refresh answers

on:
  schedule:
    - cron: "17 3 * * 1" # every Monday at 03:17 UTC
  workflow_dispatch:
    inputs:
      max:
        description: "How many answers to research in this run"
        default: "40"
      max_countries:
        description: "How many countries' law sources to research in this run"
        default: "20"
      refresh_days:
        description: "Re-research answers older than this many days"
        default: "180"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-answers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Research
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX: ${{ inputs.max || '40' }}
          MAX_COUNTRIES: ${{ inputs.max_countries || '20' }}
          REFRESH_DAYS: ${{ inputs.refresh_days || '180' }}
      - name: Open a pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data
          if git diff --cached --quiet; then echo "Nothing new to review"; exit 0; fi
          branch="review/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "Research for review $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Review: new research $(date -u +%Y-%m-%d)" \
            --body-file review-summary.md
